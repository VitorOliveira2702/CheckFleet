spring.application.name=api

# Conexão com o PostgreSQL (container definido no docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/checkfleet
spring.datasource.username=checkfleet
spring.datasource.password=checkfleet123

# update: o Hibernate cria/ajusta as tabelas a partir das entidades (ok para PoC)
spring.jpa.hibernate.ddl-auto=update

# Login com Google: o token precisa ter sido emitido pelo Google (issuer) e para
# o nosso Client ID (audience). O Client ID não é segredo (fica visível no
# navegador); o mesmo valor está em frontend/src/app/auth/auth.config.ts.
# Para usar outro, defina a variável de ambiente GOOGLE_CLIENT_ID.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_CLIENT_ID:544207910853-72jk4hbb8lavpqa40m1mgf0b8n7okk9i.apps.googleusercontent.com}
